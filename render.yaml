services:
  - type: web
    name: folio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: folio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/folio.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
